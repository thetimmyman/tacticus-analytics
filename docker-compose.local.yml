services:
  nextjs-local:
    image: node:22-bookworm
    working_dir: /workspace
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
    ports:
      - '3000:3000'
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - redis_data:/data

volumes:
  node_modules:
  redis_data:
