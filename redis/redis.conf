# Redis config for the docker-compose FULL-STACK (dev/fallback) redis only.
#
# ⚠️ NOT the production config. Production Redis runs in k3s and reads the
# `redis-config` ConfigMap in k8s/base/redis.yaml — that ConfigMap is the
# source of truth for deployed behavior. This file previously enabled RDB+AOF
# persistence, which misled readers into assuming prod Redis persists data; the
# deployed cache is deliberately persistence-free (pure cache, per
# the caching architecture review). Reconciled to mirror the deployed
# semantics so dev matches prod.
#
# Consumers of THIS file: docker/compose/docker-compose.full-stack.yml (ro
# mount) and scripts/ops/preflight-check.sh (existence check).

# Memory management — mirrors the deployed ConfigMap.
maxmemory 1gb
maxmemory-policy allkeys-lru

# Pure cache: no persistence, matching k8s/base/redis.yaml.
save ""
appendonly no

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Security (bind to container network only; password comes from --requirepass
# on the command line in both the compose file and the k8s Deployment).
bind 0.0.0.0
protected-mode no
