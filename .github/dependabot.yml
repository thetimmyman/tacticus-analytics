version: 2

# Version updates: weekly, early Monday (America/New_York). Minor and patch
# updates are grouped into one PR per ecosystem; majors stay separate and
# ungrouped. Security updates are not governed by this schedule or by cooldown.
# dependabot-automerge.yml turns on auto-merge for npm and GitHub Actions
# minor/patch PRs; the ruleset's required checks decide when they merge.

# No separate npm entry for workspaces: they share the root lockfile, and two
# entries mutating one lockfile always conflict.

# The docker ecosystem reads Dockerfiles and Kubernetes manifests in each
# listed directory, not recursively. apps/desktop/package is left out on
# purpose: its Dockerfiles are reproducible-build recipes whose base-image
# digest is pinned in apps/desktop/runtime-inputs.json, so a bump needs a
# deliberate re-proof rather than a version PR.

# Not covered by Dependabot: Node version pins (workflow `node-version:`
# fields, .nvmrc, mise.toml, apps/desktop/runtime-inputs.json).

# The native applications are shelved, so the Android Gradle plugin entry
# (`gradle` in /apps/mobile/android) is not listed. To restore it, add that
# entry with the weekly schedule, a limit of 2, a 7-day cooldown and a
# minor/patch group; gradle/verification-metadata.xml pins checksums, so each
# version PR needs the metadata regenerated by hand.

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action/*'
      github-actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Root app plus workspaces (packages/*, apps/*).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'postcss' # overrides: next > postcss 8.5.25 (exact)
      - dependency-name: 'esbuild' # overrides: tsx > esbuild 0.25.12 (exact)
      - dependency-name: 'linkify-it' # overrides: linkify-it 5.0.2 (exact)
      - dependency-name: '@types/react' # overrides: recharts > @types/react ^19.3.0
      - dependency-name: 'sharp' # overrides: sharp ^0.35.5
      # eslint 10: eslint-plugin-react (7.37.5), eslint-plugin-jsx-a11y (6.10.2)
      # and eslint-plugin-import (2.32.0), which eslint-config-next loads, accept
      # eslint 9 at most, and lint fails to start on 10. Minor and patch updates
      # still arrive. Remove this once those plugins accept eslint 10.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      docker-compose-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
