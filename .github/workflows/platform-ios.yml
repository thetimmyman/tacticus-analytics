name: Native iOS Simulator proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build, install and test phone/tablet Simulators
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 apps/mobile/ios/scripts/simulator-proof.py --output "$RUNNER_TEMP/ios-proof" --sha "$SOURCE_SHA"
      - name: Retain Simulator app and scoped synthetic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-synthetic
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/ios-proof/tacticus-ios-simulator.zip
            ${{ runner.temp }}/ios-proof/artifact.sha256
            ${{ runner.temp }}/ios-proof/evidence.json
            ${{ runner.temp }}/ios-proof/measurements.json
