name: Native Android preview

on:
  pull_request:
    paths:
      - 'apps/mobile/android/**'
      - 'tests/mobile/android/**'
      - 'docs/mobile/android/**'
      - '.github/workflows/platform-android.yml'

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare SDK
        env:
          TEST_API: ${{ matrix.api }}
        run: apps/mobile/android/scripts/prepare-sdk.sh "$TEST_API"
      - name: Compile APK and AAB, validate native lint
        run: apps/mobile/android/scripts/build.sh
      - name: Installed offline and process restart checks
        env:
          TEST_API: ${{ matrix.api }}
        run: apps/mobile/android/scripts/emulator-check.sh "$TEST_API"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unqualified-android-emulator-api-${{ matrix.api }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/reports/installed-proof/measurement.json
            apps/mobile/android/app/build/reports/installed-proof/*-evidence.json
            apps/mobile/android/app/build/reports/installed-proof/all.txt
            apps/mobile/android/app/build/reports/installed-proof/reopen.txt
            apps/mobile/android/app/build/reports/installed-proof/locked.txt
            apps/mobile/android/app/build/reports/installed-proof/relaunch.txt
