name: pgTAP Gate

# Runs rostered pgTAP suites against a migration-seeded database, after negative controls
# that must turn the runner red. Cannot cover live privileges.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/dev/pgtap-throwaway.sh'
      - 'scripts/dev/pgtap-negative-controls.sh'
      - 'scripts/dev/pgtap-controls/**'
      - '.github/workflows/pgtap-gate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/dev/pgtap-throwaway.sh'
      - 'scripts/dev/pgtap-negative-controls.sh'
      - 'scripts/dev/pgtap-controls/**'
      - '.github/workflows/pgtap-gate.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgtap-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap-general:
    name: pgtap-general
    # Fork PRs never run on the self-hosted fleet; `fork-pr-block` is the merge block.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # amd64 only: the arm64 pgTAP path is untested.
    runs-on: ${{ (github.event_name == 'pull_request' && (!github.event.repository.private || github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","amd64-builder"]') }}
    timeout-minutes: 30
    # Per-run names: the harness `docker rm -f`s its container, so a fixed name races other jobs.
    env:
      PGTAP_CONTAINER: pgtap-${{ github.run_id }}-${{ github.run_attempt }}
      PGTAP_CONTROL_CONTAINER: pgtap-controls-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify application repository identity
        run: npm run app:identity:check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Reclaim pgtap-* orphans older than 2h (past the job timeout, so never a live run's).
      - name: Reclaim stale pgTAP containers from interrupted runs
        run: |
          now=$(date +%s)
          for id in $(docker ps -aq --filter 'name=^pgtap-'); do
            created=$(docker inspect -f '{{.Created}}' "$id") || continue
            age=$(( now - $(date -d "$created" +%s) ))
            if [ "$age" -gt 7200 ]; then
              docker rm -f "$id" >/dev/null && echo "reclaimed stale container $id (${age}s old)"
            fi
          done
      - name: Negative controls (must fail before the roster is trusted)
        run: npm run test:pgtap:controls
      - name: Roster run
        run: npm run test:pgtap
