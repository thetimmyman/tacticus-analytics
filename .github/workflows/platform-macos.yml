name: macOS native adapters

on:
  pull_request:
    paths:
      - 'apps/desktop/platform/macos/**'
      - 'tests/desktop/macos/**'
      - 'docs/desktop/macos/**'
      - '.github/workflows/platform-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Compile native supervision and vault adapters
        run: |
          mkdir -p "$RUNNER_TEMP/mac-native"
          clang -Wall -Wextra -Werror apps/desktop/platform/macos/owner-guard.c -o "$RUNNER_TEMP/mac-native/owner-guard"
          swiftc apps/desktop/platform/macos/SecretVault.swift -o "$RUNNER_TEMP/mac-native/secret-vault"
      - name: Exercise native owner death and isolated synthetic Keychain
        env:
          MAC_GUARD: ${{ runner.temp }}/mac-native/owner-guard
          MAC_VAULT: ${{ runner.temp }}/mac-native/secret-vault
        run: node --test tests/desktop/macos/*.test.mjs

  packaged:
    env:
      MAC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Verify exact public source history
        run: |
          test "$(git rev-parse HEAD)" = "$MAC_SOURCE_SHA"
          test "$(git rev-list --max-parents=0 HEAD)" = "225aa3f138a93a005e460b0b04a0d4df530030c3"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.arch == 'X64'
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build pinned macOS runtime inputs
        run: node apps/desktop/platform/macos/build-inputs.mjs "$RUNNER_TEMP/mac-inputs"
      - name: Build desktop application with local origins
        env:
          STANDALONE_BUILD: 'true'
          NEXT_PUBLIC_RUNTIME_PROFILE: desktop
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9/supabase
          NEXT_PUBLIC_SUPABASE_ANON_KEY: desktop-public
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:9
          SITE_URL: http://127.0.0.1:9
        run: |
          npm ci
          npm run build
          node apps/desktop/proof/stage-standalone.mjs "$RUNNER_TEMP/mac-application"
      - name: Compile bundled native adapters
        run: |
          mkdir -p "$RUNNER_TEMP/mac-native"
          clang -Wall -Wextra -Werror apps/desktop/platform/macos/owner-guard.c -o "$RUNNER_TEMP/mac-native/owner-guard"
          swiftc apps/desktop/platform/macos/SecretVault.swift -o "$RUNNER_TEMP/mac-native/secret-vault"
      - name: Install unsigned image and exercise actual packaged offline runtime
        run: node apps/desktop/platform/macos/qualification.mjs "$RUNNER_TEMP/mac-inputs" "$RUNNER_TEMP/mac-application" "$RUNNER_TEMP/mac-native" "$RUNNER_TEMP/mac-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-synthetic-${{ matrix.os }}
          path: ${{ runner.temp }}/mac-evidence/
          if-no-files-found: warn
          retention-days: 7
