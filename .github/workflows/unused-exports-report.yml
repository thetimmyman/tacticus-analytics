name: Unused Exports Report

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unused-exports-report
  cancel-in-progress: true

jobs:
  report:
    name: unused-exports-report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: >-
        --max-old-space-size=4096
        --network-family-autoselection-attempt-timeout=3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate unused-export report
        run: |
          npm run knip -- \
            --exports \
            --include-entry-exports \
            --reporter markdown \
            --no-exit-code \
            | tee knip-unused-exports.md
          cat knip-unused-exports.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unused-export report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knip-unused-exports-${{ github.run_id }}
          path: knip-unused-exports.md
          retention-days: 30
          if-no-files-found: error
