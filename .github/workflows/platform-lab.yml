name: Platform lab smoke

on:
  pull_request:
    paths:
      - 'apps/platform-lab/**'
      - 'tests/platform-lab/**'
      - 'docs/platform-lab/**'
      - '.github/workflows/platform-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Harness self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Exercise disposable harness contracts and orchestration
        run: node --test tests/platform-lab/contracts.test.mjs tests/platform-lab/workspace.test.mjs tests/platform-lab/runner.test.mjs
