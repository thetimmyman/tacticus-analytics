name: Real Identity Scan

# The known-identities list is PII and exists only on the runner, so this
# never runs for pull requests; it checks main after merge and daily.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-identity-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: real-identity-scan
    # Fork PRs must never run on self-hosted runners.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, amd64-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No dependencies are installed; the automatic npm cache save hung.
          package-manager-cache: false
      - name: Scan tracked files for known real identities
        # TA_KNOWN_IDENTITIES_FILE comes from the runner environment.
        run: node scripts/security/check-real-identities.mjs --selftest && node scripts/security/check-real-identities.mjs --scan
