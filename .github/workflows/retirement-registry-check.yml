name: Retirement Registry Check

# Reporting-only: no retired capability may return via a shared migration or image.

on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retirement-registry-check
  cancel-in-progress: true

jobs:
  check:
    name: retirement-registry-check
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, amd64-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run retirement registry gate against live state
        run: |
          set -uo pipefail
          node scripts/governance/check-retirement-registry.mjs | tee retirement-registry-report.txt
          {
            echo '### Retirement registry check'
            echo '```'
            cat retirement-registry-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
