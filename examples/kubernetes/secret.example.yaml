# Shape of the runtime Secret only. kustomization.yaml leaves it out on purpose:
# applying it would overwrite the real Secret with these placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: tacticus-analytics-runtime
type: Opaque
stringData:
  ENCRYPTION_KEY: replace-with-a-secret
  SUPABASE_SERVICE_ROLE_KEY: replace-with-a-secret
  CRON_SECRET: replace-with-a-secret
  HEALTH_CHECK_SECRET: replace-with-a-secret
  LOKI_SCRAPER_CLIENT_SECRET: replace-with-a-secret
