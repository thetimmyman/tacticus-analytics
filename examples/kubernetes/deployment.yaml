apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacticus-analytics-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tacticus-analytics-web
  template:
    metadata:
      labels:
        app: tacticus-analytics-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.com/tacticus-analytics-web:REPLACE_WITH_IMMUTABLE_TAG
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tacticus-analytics-config
            - secretRef:
                name: tacticus-analytics-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health/process
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/process
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/process
              port: http
            periodSeconds: 5
