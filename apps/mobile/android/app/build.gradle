plugins { id 'com.android.application' }

android {
    namespace 'com.tacticusanalytics.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tacticusanalytics.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        testInstrumentationRunner 'com.tacticusanalytics.mobile.AndroidProof'
    }
    def playerSchemaDir = layout.buildDirectory.dir('generated/player-schema')
    sourceSets {
        main {
            assets.srcDir(playerSchemaDir)
            resources.srcDir(playerSchemaDir)
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def releaseStore = System.getenv('ANDROID_RELEASE_KEYSTORE')
    if (releaseStore) {
        ['ANDROID_RELEASE_STORE_PASSWORD','ANDROID_RELEASE_KEY_ALIAS','ANDROID_RELEASE_KEY_PASSWORD'].each { name ->
            if (!System.getenv(name)) throw new GradleException('Complete protected signing inputs are required')
        }
        signingConfigs {
            protectedRelease {
                storeFile file(releaseStore)
                storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false; debuggable false; if (releaseStore) signingConfig signingConfigs.protectedRelease }
    }
}

// One source owns both native assets and the JVM/classloader resource.
def generatePlayerSchema = tasks.register('generatePlayerSchema', Copy) {
    from(rootProject.file('../../../packages/workspace-onboarding/player-schema.json'))
    into(layout.buildDirectory.dir('generated/player-schema'))
}
tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name.startsWith('merge') &&
            (task.name.endsWith('Assets') || task.name.endsWith('JavaResource'))) {
        task.dependsOn(generatePlayerSchema)
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
