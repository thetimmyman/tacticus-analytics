<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local workspace</title>
  </head>
  <body>
    <main>
      <h1 id="heading">Local workspace</h1>
      <p>
        Your OS account controls local workspace access. No app password is
        required. Player access is required for a new personal workspace. You
        can add Guild and Guild Raid access through the Official access menu.
        Cloud contribution stays off.
      </p>
      <form data-mode="SETUP_MODE">
        <button type="submit">Open workspace</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="/desktop/setup.js"></script>
  </body>
</html>
